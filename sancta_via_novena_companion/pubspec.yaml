name: novena_companion
description: "Catholic novena companion app with traditional nine-day prayer devotions and liturgical integration"
publish_to: 'none'

# App Store Information
app_store:
  display_name: "Sancta Via Novena"
  short_description: "Traditional Catholic nine-day prayer devotions"
  full_description: |
    Sancta Via Novena is your complete companion for traditional Catholic novena prayers. 
    Features nine-day prayer cycles, saint devotions, notification reminders, and beautiful liturgical integration.
  keywords: "catholic, novena, prayer, devotion, saints, nine days, traditional"
  category: "Reference"
  age_rating: "4+"

# Version: major.minor.patch+build
version: 1.1.24

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  auto_size_text: ^3.0.0
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  pinput: ^5.0.0
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  timezone: ^0.9.4
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_icon.png
    - assets/images/
    - assets/prayers/
    - assets/prayers/basic/
    - assets/icons/
    - assets/novenas/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21