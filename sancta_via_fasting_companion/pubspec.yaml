name: sancta_via_fasting_companion
description: 'Catholic fasting companion app with scriptural encouragement and liturgical integration'
publish_to: 'none'

# App Store Information
app_store:
  display_name: 'Sancta Via Fasting'
  short_description: 'Catholic fasting tracker with scriptural encouragement'
  full_description: |
    Sancta Via Fasting Companion helps Catholics track various fasting types (intermittent, 24-hour, multi-day)
    with integrated encouragement featuring scriptural quotes, saint writings, prayers, and imagery to support
    spiritual growth through fasting.
  keywords: 'catholic, fasting, prayer, saints, scripture, intermittent fasting, spiritual growth, lent'
  category: 'Health & Fitness'
  age_rating: '4+'

# Version: major.minor.patch+build
version: 1.0.10

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.4
  fl_chart: ^0.69.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.4
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.18.1
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  share_plus: ^10.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  timezone: ^0.9.2

dev_dependencies:
  build_runner: ^2.4.13
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/

