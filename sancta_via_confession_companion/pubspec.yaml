name: confession_companion
description: "Catholic examination of conscience and confession companion app"
publish_to: 'none'

# App Store Information
app_store:
  display_name: "Sancta Via Confession"
  short_description: "Catholic examination of conscience and confession guide"
  full_description: |
    Sancta Via Confession is a comprehensive Catholic confession companion app featuring
    examinations of conscience, spiritual guidance, and tools to help prepare for the Sacrament of Reconciliation.
  keywords: "catholic, confession, examination of conscience, reconciliation, sacrament, prayer"
  category: "Reference"
  age_rating: "4+"

# Version: major.minor.patch+build
# App Store: CFBundleShortVersionString = 1.0.0, CFBundleVersion = 1
# Google Play: versionName = 1.0.0, versionCode = 1
version: 1.1.19

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Sancta Via packages - LOCAL DEVELOPMENT VERSIONS
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  cider: ^0.2.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/examinations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21