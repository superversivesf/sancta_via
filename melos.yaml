name: sancta_via_workspace

packages:
  - sancta_via_*

scripts:
  bootstrap:
    run: melos bootstrap
    description: Link all packages and install dependencies.

  analyze:
    run: melos exec -- flutter analyze --no-fatal-infos .
    description: Run static analysis on all packages (errors+warnings fatal; infos tracked).

  format:
    run: melos exec -- dart format .
    description: Format code in all packages.

  test:
    run: melos exec --dir-exists=test -- flutter test
    description: Run tests in packages that have a test directory.

  build:android:
    run: melos exec --dir-exists=android --fail-fast -- flutter build apk
    description: Build Android APK for all apps.
    
  clean:
    run: melos exec -- flutter clean
    description: Clean all packages.

  version:bump:patch:
    run: melos exec --file-exists=lib/main.dart --flutter -- flutter pub run cider bump patch --bump-build
    description: Bump patch version (and build number) in all app packages.

  version:bump:build:
    run: dart run tool/bump_build_numbers.dart
    description: Increment the build number (+N) in all app pubspecs (apps only).

  version:bump:minor:
    run: melos exec --file-exists=lib/main.dart --flutter -- flutter pub run cider bump minor --bump-build
    description: Bump minor version (and build number) in all app packages.

  version:bump:major:
    run: melos exec --file-exists=lib/main.dart --flutter -- flutter pub run cider bump major --bump-build
    description: Bump major version (and build number) in all app packages.