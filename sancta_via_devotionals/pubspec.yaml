name: sancta_via_devotionals
description: 'Offline Catholic devotionals: Today pipeline, guided prayer sessions, and commitment trackers'
publish_to: 'none'

# Version: major.minor.patch+build
version: 1.0.10

environment:
  sdk: ^3.9.2

dependencies:
  bible_data:
    path: ../sancta_via_bible_data
  bible_data_riverpod:
    path: ../sancta_via_bible_data_riverpod
  crypto: ^3.0.8
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.4.0
  flutter_timezone: ^3.0.1
  go_router: ^15.1.2
  package_info_plus: ^8.3.0
  path: ^1.9.1
  sancta_via_devotional_engine:
    path: ../sancta_via_devotional_engine
  sancta_via_devotional_engine_riverpod:
    path: ../sancta_via_devotional_engine_riverpod
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  timezone: ^0.9.4

dev_dependencies:
  cider: ^0.2.8
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    # The content pack catalog ships from the APP bundle (Plan 2, Task 6):
    # the content pipeline resolves `assets/content/packs/*.json` against
    # this app's own asset manifest. The engine-fixture-origin pack files
    # are byte-for-byte copies of
    # `sancta_via_devotional_engine/test/fixtures/packs/` (single source of
    # truth = the engine fixtures; regenerate via copy whenever they
    # change); the Task 21 routine packs are authored here — the pin test
    # distinguishes the two.
    - assets/content/packs/
    # The imported companion prayers (Plan 2, Task 21): one engine
    # PrayerText JSON per prayer, written by `tool/import_prayers.dart` and
    # committed. They ride the SAME asset manifest as the packs (the
    # pipeline's pack loader filters `assets/content/packs/`, so prayer
    # files are never parsed as packs); the pin test pins the manifest keys
    # and the import mapping.
    - assets/content/prayers/
    - assets/icons/
  # Include the Material Icons font.
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
