name: saint_data
description: Saint dataset, SQLite store, and search for Sancta Via apps
publish_to: 'none'
version: 0.1.0
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  sqflite: ^2.3.3+1
  sqflite_common: ^2.5.0
dev_dependencies:
  crypto: ^3.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.2.0
  image: ^4.2.0
  sqflite_common_ffi: ^2.3.0
flutter:
  assets:
    - assets/
    - assets/thumbs/

# Dev/test/tool build-hook defines (only take effect when this package is the
# build workspace root, never for apps depending on it). The sqlite3 bundled
# native-assets build lacks FTS4 ("no such module: fts4"); spec section 6 pins
# the search table to FTS4 + unicode61, so on host machines the hook links the
# system SQLite, which enables FTS3/FTS4/FTS5. Device builds are unaffected.
hooks:
  user_defines:
    sqlite3:
      source:
        macos: system
        linux: system
