name: saint_companion
description: A focused Catholic saints companion app with searchable saint profiles, categories, favorites, and feast-day celebrations
publish_to: 'none'

# App Store Information
app_store:
  display_name: "Sancta Via Saints"
  short_description: "Catholic saint profiles, categories, and search"
  full_description: |
    Sancta Via Saints is a beautiful Catholic saints companion app that helps you stay connected
    to the communion of saints. Features searchable saint profiles, category browsing, favorites,
    and liturgical theming that adapts to the Church year.
  keywords: "catholic, saints, feast days, church, patron saints, holiness, reference"
  category: "Reference"
  age_rating: "4+"

# Version: major.minor.patch+build
version: 1.0.9+5
repository: https://github.com/superversivesf/sancta_via_saint_companion
homepage: https://sancta-via.net

environment:
  sdk: ^3.9.2
  flutter: ">=3.9.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  intl: ^0.20.2
  package_info_plus: ^8.3.0
  saint_data:
    path: ../sancta_via_saint_data
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  shared_preferences: ^2.5.3

dev_dependencies:
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.0
  sqflite_common_ffi: ^2.3.0
  sqlite3: ^3.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    # The saint database ships from the APP bundle: SaintRepository's open
    # resolves the literal key `assets/saints.db` against this app's own
    # asset bundle (package assets from a dependency resolve only under
    # `packages/saint_data/...`, which the repository's literal key never
    # requests — the trap that silently blanked the app on devices, fixed in
    # the final-review wave). House precedent:
    # sancta_via_bible_reading_app/assets/bibles.db.
    - assets/saints.db

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#001f3d"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"
  min_sdk_android: 21

# Dev/test build-hook defines (only take effect when this package is the
# build workspace root). The sqlite3 bundled native-assets build lacks FTS4
# ("no such module: fts4") and the saint search table is pinned to FTS4 +
# unicode61, so the host build loads the SYSTEM SQLite (FTS4 enabled) for the
# in-memory fixture database used by the provider tests. The `source` map
# keys only host/build OSes — android/ios stay unmapped, which resolves to
# the bundled precompiled binary at release-build time (verified against
# sqlite3 3.9.1's hook: `forTargetOS` returns null for unmapped targets and
# `case null:` builds/bundles the GitHub asset). The `sqlite3: ^3.9.1` dev
# dep floor keeps the hook on the version whose parser accepts this
# platform-keyed map shape (3.5.2, the version a bare resolve picked, only
# understands the flat string form).
hooks:
  user_defines:
    sqlite3:
      source:
        macos: system
        linux: system
