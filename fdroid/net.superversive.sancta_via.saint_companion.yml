AutoName: Sancta Via Saints
Summary: Searchable saint profiles with categories, feast days and prayers
Description: |-
    See the app listing on F-Droid's rendered metadata once merged; source copy lives in
    sancta_via_saint_companion/fastlane/metadata/android/en-US/full_description.txt

RepoType: git
Repo: https://github.com/superversivesf/sancta_via

Builds:
  - versionName: 1.0.6
    versionCode: 2
    commit: releases/saint_companion/v1.0.6+2
    subdir: sancta_via_saint_companion
    sudo: |
      apt-get update || apt-get install -y openjdk-17-jdk
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    rm:
      - ios
      - .dart_tool
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

AutoUpdateMode: None
UpdateCheckMode: None
