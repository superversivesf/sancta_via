Builds:
  - versionName: 1.1.55
    versionCode: 8
    commit: releases/novena_companion/v1.1.55+8
    subdir: sancta_via_novena_companion
    sudo: |
      apt-get update && apt-get install -y openjdk-17-jdk
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.8
    rm:
      - ios
      - .dart_tool
    build:
      - $$flutter$$/bin/flutter config --no-analytics
      # F-Droid signs with its own key; the repo's release-build signing gate
      # (which fails without key.properties) must be turned off for this build.
      - $$flutter$$/bin/flutter pub get
      # F-Droid signs with its own key; the repo's signing gate must be
      # turned off for this build (no gitrolled key.properties on the server).
      - SV_ALLOW_DEBUG_SIGNING=1 $$flutter$$/bin/flutter build apk --release --target-platform android-arm64

