name: bible_reading_app
description: "Catholic Bible reading app with liturgical integration and multiple Bible translations"
publish_to: 'none'

# App Store Information
app_store:
  display_name: "Sancta Via Bible"
  short_description: "Catholic Bible reading with liturgical integration"
  full_description: |
    Sancta Via Bible is a comprehensive Catholic Bible reading app that integrates with the liturgical calendar.
    Features multiple Bible translations, daily readings, and spiritual resources for Catholic faithful.
  keywords: "catholic, bible, liturgy, scripture, prayer, daily readings"
  category: "Reference"
  age_rating: "4+"

# Version: major.minor.patch+build
# App Store: CFBundleShortVersionString = 1.0.0, CFBundleVersion = 1
# Google Play: versionName = 1.0.0, versionCode = 1
version: 1.1.28

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  # Archive for gzip decompression (DEV ONLY - not used in shipped app)
  # archive: ^3.6.1
  
  # Sancta Via packages - LOCAL DEVELOPMENT VERSIONS
  bible_data:
    path: ../sancta_via_bible_data
  bible_data_riverpod:
    path: ../sancta_via_bible_data_riverpod

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flutter:
    sdk: flutter

  # Notifications - REMOVED
  # flutter_local_notifications: ^17.2.4

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  package_info_plus: ^8.3.0
  # permission_handler: ^11.3.1 # REMOVED - was used for notifications
  
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui

  # Storage
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  # timezone: ^0.9.4 # REMOVED - was used for notifications

dev_dependencies:
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/app_icon.png
    - assets/bibles.db

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21