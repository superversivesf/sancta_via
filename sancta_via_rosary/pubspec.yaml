name: rosary_companion
description: "Guided meditation rosary app with liturgical calendar integration"
publish_to: 'none'

# App Store Information
app_store:
  display_name: "Sancta Via Rosary"
  short_description: "Guided meditation rosary app with liturgical calendar integration"
  full_description: |
    Sancta Via Rosary is your complete companion for prayerful rosary meditation.
    Features guided prayers for each mystery, beautiful liturgical theming, progress tracking,
    and seamless integration with the Catholic liturgical calendar.
  keywords: "catholic, rosary, prayer, meditation, mysteries, liturgical, traditional"
  category: "Reference"
  age_rating: "4+"

# Version: major.minor.patch+build
version: 1.0.4

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  audio_session: ^0.1.18
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  just_audio: ^0.9.36
  package_info_plus: ^8.3.0
  path: ^1.9.1
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  timezone: ^0.9.4

dev_dependencies:
  build_runner: ^2.4.13
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/rosary/
    - assets/mysteries/
    - assets/audio/prayers/
    - assets/audio/mysteries/
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
