name: sancta_via_devotional_engine_riverpod
description: Riverpod providers for the sancta_via_devotional_engine with reactive program, today, and progress state.
version: 0.1.0
repository: https://github.com/superversivesf/sancta_via_devotional_engine_riverpod
homepage: https://sancta-via.net

# This package is consumed from the Sancta Via monorepo via path
# dependencies and is not published to pub.dev.
publish_to: none

# Package metadata for discovery (see publish_to above).
topics:
  - catholic
  - devotional
  - riverpod
  - flutter
  - sancta-via

# Funding information
funding:
  - https://github.com/sponsors/superversive-ca

environment:
  sdk: ^3.9.2
  flutter: ">=3.9.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sancta_via_devotional_engine:
    path: ../sancta_via_devotional_engine
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod

dev_dependencies:
  cider: ^0.2.8
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # No assets needed - the fixture packs are embedded Dart sources
  # generated by tool/embed_packs.dart.
