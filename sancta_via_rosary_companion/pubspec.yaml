name: sancta_via_rosary_companion
description: "Catholic rosary companion app for praying the traditional rosary with liturgical integration"
publish_to: 'none'

# Version: major.minor.patch+build
version: 1.0.5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Sancta Via shared modules
  sancta_via_shared_ui:
    path: ../sancta_via_shared_ui
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar
  sancta_via_liturgical_calendar_riverpod:
    path: ../sancta_via_liturgical_calendar_riverpod

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Storage & persistence
  shared_preferences: ^2.5.3
  sqflite: ^2.3.3+1
  path: ^1.9.1

  # Utilities
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.3.0
  intl: ^0.20.2

dev_dependencies:
  build_runner: ^2.4.13
  cider: ^0.2.8
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/data/
