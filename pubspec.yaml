name: bible_data
description: A pure Dart package for Catholic Bible texts with search and lookup capabilities
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  meta: ^1.9.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter:
    sdk: flutter

dev_dependencies:
  test: ^1.24.0
  lints: ^4.0.0

homepage: https://sancta-via.net
repository: https://github.com/superversivesf/sancta_via_bible_data
issue_tracker: https://github.com/superversivesf/sancta_via_bible_data/issues
documentation: https://github.com/superversivesf/sancta_via_bible_data#readme

# Funding information
funding:
  - https://github.com/sponsors/superversive-ca

