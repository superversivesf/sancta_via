name: sancta_via_devotional_engine
description: 'Pure Dart engine for Catholic devotional programs: scheduling, sessions, and progress'
version: 0.1.0
repository: https://github.com/superversivesf/sancta_via_devotional_engine
homepage: https://sancta-via.net

# This package is consumed from the Sancta Via monorepo via path
# dependencies and is not published to pub.dev.
publish_to: none

# Package metadata for discovery (see publish_to above).
topics:
  - catholic
  - devotional
  - engine
  - prayer
  - church
  - sancta-via

# Funding information
funding:
  - https://github.com/sponsors/superversive-ca

environment:
  sdk: ^3.9.2

# Add regular dependencies here.
dependencies:
  # Only dependency: path-linked liturgical calendar data (pure Dart).
  sancta_via_liturgical_calendar:
    path: ../sancta_via_liturgical_calendar

dev_dependencies:
  cider: ^0.2.8
  lints: ^4.0.0
  test: ^1.24.0
